# Example configuration for N.O.R.A. Core
# Please fill in your details by running `python configure.py`

telegram:
  bot_token: "YOUR_TELEGRAM_BOT_TOKEN"

llm:
  # Supported providers: "gemini", "openai"
  provider: "gemini"
  
  # API keys for the providers
  api_keys:
    gemini: "YOUR_GEMINI_API_KEY"
    openai: "YOUR_OPENAI_API_KEY"
  
  # Model aliases used by the application
  models:
    smart: "gemini-1.5-pro-latest"
    fast: "gemini-1.5-flash-latest"
    coder: "gemini-1.5-pro-latest"

memory:
  # Vector Database (Qdrant)
  qdrant:
    host: "localhost"
    port: 6333
  
  # Document Database (MongoDB)
  mongo:
    uri: "mongodb://nora:nora_password@localhost:27017/"

  # Embedding Service (Text -> Vector)
  embedding:
    provider: "openai_compatible" # Generic OpenAI compatible client
    base_url: "https://api.siliconflow.cn/v1" # SiliconFlow endpoint
    api_key: "YOUR_SILICONFLOW_API_KEY"
    model: "BAAI/bge-m3" # Recommended for RAG
    dimensions: 1024 # BGE-M3 output dimensions
