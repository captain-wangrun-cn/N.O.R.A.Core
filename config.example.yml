# Example configuration for N.O.R.A. Core
# Please fill in your details by running `python configure.py`

# 工作区配置
workspace:
  # 工作区根路径（技能、下载、数据等都存储在这里）
  # 默认: ~/.nora/workspace
  # 可选值:
  #   - 绝对路径: /home/user/my_workspace
  #   - 相对路径: ./workspace (相对于项目根目录)
  #   - 用户主目录: ~/my_workspace
  root_path: "~/.nora/workspace"

# 日志配置（按日期切分，自动清理过期文件）
logging:
  retention_days: 7   # 日志保留天数，<=0 表示不自动清理
  dir: null             # 可选：自定义日志目录，默认使用 workspace/logs

# 全局网络代理（启用后适配器/LLM/requests/httpx 等都会继承环境变量）
network:
  proxy:
    enabled: false
    # 快捷方式：单一代理地址（http/https/all 共用）
    # url: "http://127.0.0.1:7890"
    # 细分方式（可选，优先于 url）：
    # http: "http://127.0.0.1:7890"
    # https: "http://127.0.0.1:7890"
    # all: "socks5://127.0.0.1:7890"
    # no_proxy: "127.0.0.1,localhost,.local"

# 平台 adapter 私有配置放在各自目录的 config.json 中，不写入全局 config.yml。
# 例如：
#   - adapters/telegram/config.json -> bot_token
#   - adapters/onebotv11/config.json -> websocket_url / access_token / enable_napcat_api

# 主人识别（跨平台接力）
# Nora 是同一个连续的人；owner 用来认出"哪个账号是主人"。
# 留空则启用纯自动绑定：每个平台的第一个私聊者会被自动绑为主人。
# 也可在此预声明主人身份，启动时注入（群聊里只有匹配身份才算主人，其余为访客）。
owner:
  identities: []
    # - platform: telegram
    #   user_id: "123456789"
    #   display_name: "主人"   # 可选，仅备注用

llm:
  # 默认提供商（当某个 alias 未显式绑定 provider 时使用）
  provider: "gemini_main"

  # 多提供商配置
  # type: "gemini" | "openai" | "anthropic" | "openrouter" | "civitai"
  providers:
    gemini_main:
      type: "gemini"
      api_key: "YOUR_GEMINI_API_KEY"
    openai_main:
      type: "openai"
      api_key: "YOUR_OPENAI_API_KEY"
      base_url: "https://api.openai.com/v1"
      # 可选：使用 OpenAI Responses API 代替 Chat Completions
      # use_responses_api: true
      # 可选：用于某些兼容端点伪装浏览器请求
      # user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0 Safari/537.36"
    anthropic_main:
      type: "anthropic"
      api_key: "YOUR_ANTHROPIC_API_KEY"
    # openrouter_main:
    #   type: "openrouter"
    #   api_key: "YOUR_OPENROUTER_API_KEY"
    #   base_url: "https://openrouter.ai/api/v1"
    # Civitai：只能绑给 draw，且只做图生图（必须有参考图，没有就报错不出图）。
    # 模型别名填 AIR 标识或托管模型名，见下方 llm.models.draw 注释。
    # civitai_main:
    #   type: "civitai"
    #   api_key: "YOUR_CIVITAI_API_TOKEN"
    #   base_url: "https://orchestration.civitai.com"
    #   # 该 provider 专用代理；留空则继承全局 network.proxy（环境变量）
    #   # proxy: "http://127.0.0.1:7890"
    #   # engine 一般不用填：AIR 模型自动走 sdcpp，托管模型用模型名本身
    #   # engine: "sdcpp"

  # 为每个模型别名绑定提供商（值为 providers 的键）
  model_providers:
    smart: "gemini_main"
    fast: "openai_main"
    coder: "openai_main"
    image: "gemini_main"
    summary: "anthropic_main"
    # draw: "gemini_main"        # 可选：文生图模型（形象图生成，不配置则 [DRAW:] 与参考图工具不可用）
    # draw_desc: "openai_main"   # 可选：把要求写成生图提示词的文本模型
    # fast-image: "gemini_main"  # 可选：表情包快速描述模型（不配置则表情包不做内容解读）

  # 兼容旧版配置（可选，建议保留）
  # api_keys:
  #   gemini: "YOUR_GEMINI_API_KEY"
  #   openai: "YOUR_OPENAI_API_KEY"
  # base_url: "https://api.openai.com/v1"
  # user_agent: "..."

  # Model aliases used by the application
  models:
    smart: "gemini-1.5-pro-latest"
    fast: "gpt-4o-mini"
    coder: "gpt-4o"
    image: "gemini-1.5-pro-latest" # 用于图片输入理解的模型
    video: "gemini-2.5-flash" # 用于视频输入理解的模型（可选，不配置则视频不入库）
    summary: "claude-3-5-haiku-latest" # 用于消息历史总结的模型
    # 形象生图（可选，两个都配才启用）：
    # draw: "gemini-2.5-flash-image"  # 文生图模型，需支持参考图输入以锚定形象一致性
    # draw_desc: "gpt-4o-mini"        # 普通文本模型，负责把要求 + APPEARANCE.md 写成生图提示词
    # 绑 civitai 类型 provider 时，draw 填 AIR 标识或托管模型名：
    # draw: "urn:air:sdxl:checkpoint:civitai:101055@128078"   # Civitai 模型页 → 模型id@版本id
    # draw: "grok"                                            # 或托管模型（grok / klein 等）
    # ⚠️ Civitai 只做图生图：必须先有 appearance/refs/ 下的参考图，否则直接报错不出图。
    #    SD 系模型建议同时把 llm.draw_prompt_style 设成 "tags"。
    # fast-image: "gemini-2.0-flash"  # 可选：表情包快速描述模型

  # 输出 token 上限（统一）
  max_output_tokens: 768

  # 生图接口形态（只对 openai 类型 provider 生效；gemini / openrouter 各有自己的固定端点）
  #   images（默认）：/v1/images/generations + /v1/images/edits（OpenAI 官方、gpt-image-1 / dall-e-*）
  #   chat：/v1/chat/completions + modalities: ["text","image"]，图片以 data URI 内嵌在回复里
  #         （多数中转站把 gemini image 模型挂成 openai 协议时只实现这条，走 images 会 404）
  # draw_api: "images"

  # images.edit 参考图上传格式（仅 draw_api=images、且带参考图时生效；纯文生图走 images.generate 不受影响）
  #   form（默认）：multipart/form-data，OpenAI SDK 官方行为（OpenAI 官方、gpt-image-1 / dall-e-*）
  #   json：application/json，参考图以 base64 data URI 内嵌（部分中转站把 /v1/images/edits
  #         实现成只收 JSON，form 会直接 415；设置 json 后仍会先试 JSON，被拒才退回 form）
  #   ⚠️ json 模式下参考图只能传一张（端点不吃数组），多余的会被丢弃并打 warning。
  # draw_edit_encoding: "form"

  # 生图提示词写法（与接口形态无关，取决于 draw 模型吃哪种提示词）
  #   natural（默认）：完整英文句子，描述画面与空间关系
  #                    —— Gemini / nano-banana、Grok、GPT-Image 等按语言理解画面的模型
  #   tags：逗号分隔的英文关键词标签
  #         —— Stable Diffusion / NovelAI 等按标签匹配的模型
  #   选错不报错，只是出图变差：标签串喂 nano-banana 会丢空间关系，长句喂 SD 会被截断。
  # draw_prompt_style: "natural"

  # 按 alias 单独设置输出 token 上限（优先级高于全局）
  # max_output_tokens_by_alias:
  #   smart: 768
  #   fast: 512
  #   coder: 1024

  # 推理强度（reasoning effort）
  # 取值: none / minimal / low / medium / high / xhigh / max / auto
  #   不配置 = 完全不传该字段，用端点自己的默认行为
  #   none   = 显式关闭思考（适合 fast / fast-image 这类要求低延迟的别名）
  #   auto   = 让模型自己决定思考多少（本项目自己的档位，翻译成各家的原生自动模式）
  # ⚠️ 档位是**按模型**支持的，不是按家：xhigh/max 只有少数新模型认。
  # 各家 API 字段不通用，由 provider 自己翻译同一个档位：
  #   openai(Chat)      → reasoning_effort="high"
  #   openai(Responses) → reasoning={effort:high}          ← 嵌套，和上面不是一个写法
  #   openrouter        → reasoning={effort:high}
  #   anthropic 4.6+    → output_config={effort:high}       ← 顶层字段，不在 thinking 里
  #   anthropic 4.5-    → thinking={type:enabled, budget_tokens:24576}
  #   gemini 3.x        → thinking_config={thinking_level:HIGH}
  #   gemini 2.5        → thinking_config={thinking_budget:24576}
  # 不支持推理的模型收到该字段会 400，provider 会自动摘掉该字段重试一次。
  # effort: "medium"

  # 按 alias 单独设置推理强度（优先级高于全局 effort）
  # 也可以在 Telegram 里用 /effort 按钮实时修改并写回本文件。
  # effort_by_alias:
  #   smart: "high"
  #   fast: "none"
  #   coder: "xhigh"
  #   draw_desc: "low"

memory:
  # 消息历史管理
  message_history:
    raw_window: 50 # 原始消息窗口大小（完整保留）
    compress_window: 50 # 超过此数量开始压缩（按消息数量，可在 config.yml 自定义）
    compress_ratio: 10 # 压缩比例（10条压缩为1条总结）
    archive_threshold: 500 # 超过此数量创建归档总结
    timezone: "Asia/Shanghai" # 时间戳显示时区（如 "Asia/Shanghai", "UTC", "America/New_York"）
    timestamp_format: "%Y-%m-%d %H:%M:%S %A" # 消息时间戳格式，包含年月日星期时分秒
    mirror_db_path: null # （可选）原文镜像库路径，默认 workspace/data/memory/message_log.db
    context_db_path: null # （可选）压缩上下文库路径，默认 workspace/data/memory/context_compression.db
    long_message_threshold: 1200 # 最新 3 段判定“过长”并提前压缩的字符阈值

  # Vector Database (Qdrant)
  qdrant:
    # 本地实例：host + port
    host: "localhost"
    port: 6333
    # Qdrant Cloud / 远程实例：配置 url 后优先走 HTTPS + API key，host/port 失效。
    # 例：url: "https://xxxx.us-west-1-0.aws.cloud.qdrant.io"
    #     api_key: "eyJhbGciOi..."

  # Document Database (MongoDB)
  mongo:
    uri: "mongodb://nora:nora_password@localhost:27017/nora"
    # db_name: "nora"  # （可选）显式指定数据库名。留空则取 URI 路径里的库名（如 .../nora_qiuxi），再兜底为 "nora"。
    #                   受限用户通常只对自己的库有权限，请让此处与 URI 中的库名一致，否则会报 not authorized。

  # Embedding Service (Text -> Vector)
  embedding:
    provider: "openai_compatible" # Generic OpenAI compatible client
    base_url: "https://api.siliconflow.cn/v1" # SiliconFlow endpoint
    api_key: "YOUR_SILICONFLOW_API_KEY"
    model: "BAAI/bge-m3" # Recommended for RAG
    dimensions: 1024 # BGE-M3 output dimensions

# CUSTOM.md 注入范围（可选）
# scopes 为空或缺失时表示全量注入。
# 可选值: fast, smart, image, coder
# 设置为 ["none"] 可关闭全部 CUSTOM 注入
custom_injection:
  scopes:
    - fast
    - smart
    - image
    - coder

# Nora 偏好设置
nora_preferences:
  nora_followup_probability: 1.0      # follow-up 检测为 FOLLOWUP 后，实际发送的概率
  proactive_message_probability: 1.0  # 自主型主动消息（autonomous）的实际发送概率
  split_reply_probability: 0.7        # 倾向用 [SPLIT] / [SPLIT:秒数] 分段聊天的强度
  short_reply_preference: 0.5         # 越高越偏短句
  verbosity_preference: 0.5           # 越高越愿意补充解释
  pause_between_splits_seconds: 1.0   # 默认建议分段停顿秒数
  warmth_level: 0.7                   # 温柔/亲近感强度
  playfulness_level: 0.4              # 俏皮程度
  emotional_expressiveness: 0.6       # 情绪表达强度
  assertiveness_level: 0.5            # 主张/建议强度
  followup_skip_end_after: 3          # 连续若干次 FOLLOWUP 因概率未发送后，直接 END

# Tavily 网络搜索 API (可选)
tavily:
  api_key: "YOUR_TAVILY_API_KEY" # 从 https://tavily.com/ 获取
  timeout: 10 # API 请求超时时间（秒）

# 成本跟踪配置
cost_tracking:
  enabled: true # 是否启用成本跟踪

  # 自定义模型价格（USD per million tokens）
  # 如果不配置，将使用内置价格数据（Gemini, OpenAI 官方价格）
  # 格式: model_name: {input: price, output: price}
  custom_prices:
    # 示例: 自定义模型价格
    # "my-custom-model": {"input": 0.5, "output": 2.0}

# 安全审查模型（可选，默认关闭）
# 开启后，每次工具调用前会经过独立 LLM 审查，白名单工具除外
security:
  enabled: false
  # 白名单工具（这些工具不经过安全审查）
  tool_whitelist:
    - view_media
    - crop_image_for_llm
    - read_file
    - list_dir
    - search
    - get_available_skills
    - report_progress
    - store_progress_note
    - get_progress_note
    - list_alarms
    - read_secret_vault

# 主动消息调度配置
schedule:
  enabled: true  # 是否启用主动消息调度系统
  # 说明:
  #   - 每天凌晨 00:00 自动根据 SCHEDULE.md + SOUL/USER/MEMORY 生成当日主动消息触发计划
  #   - 支持动态闹钟工具 (set_alarm / list_alarms / cancel_alarm)
  #   - 闹钟数据持久化到 workspace/cache/alarms.json
  #   - 编辑 SCHEDULE.md (workspace 目录下) 自定义作息和日程
  #   - 群聊定时监听同属本开关：每天 00:00 依据 workspace/GROUP_LISTEN.json 的候选群池
  #     生成当日「时间 + 平台 + 群号」计划，到点把该群切到 ONLINE 开始被动监听。
  #     一个时间点只激活一个群；若该群触发时已是 ONLINE 则跳过（与私聊主动消息一致）。
  #     GROUP_LISTEN.json 由 Nora 自己维护（候选群 groups / 偏好 preferences），
  #     把 enabled 设为 false 可单独关闭群聊定时监听。

# 外部触发器配置已迁移到 `triggers/config.yml`
# 请复制：`triggers/config.example.yml` -> `triggers/config.yml`

# 交互配置
interaction:
  buffer_timeout: 3.0   # 消息聚合缓冲时间（秒）
  non_stream: false     # 默认是否启用非流式（true=一次性输出；false=流式）
  group_listener:
    enabled: true                 # 启用单活跃群的 ONLINE / SEMI_ONLINE 监听
    # 未登记群固定为 SEMI_ONLINE；具体群进入 ONLINE 时会自动接管并关闭旧活跃群
    evaluation_batch_size: 2      # passive 与生成期 append 累计多少条新事件后调用 fast 判断
    idle_seconds: 90              # pending 非空且最后消息静默多久后判断
    max_pending_messages: 20      # 仅限制运行时待判断窗口，不截断共享历史
    decision_timeout_seconds: 30  # fast 被动/追加判断超时
    # 硬超时降级（不依赖 fast 模型，也不要求待判断窗口非空）；设为 0 关闭对应项
    watchdog_interval_seconds: 30       # 看门狗巡检间隔
    no_interaction_timeout_seconds: 1800  # 多久没人 @ / 回复 Nora 就退出监听
    idle_exit_seconds: 1200            # 群里多久没有任何新消息就退出监听
    max_online_seconds: 21600          # 单次 ONLINE 的绝对上限（6 小时）
    directed_veto_seconds: 300         # 窗口内定向消息一票否决 SEMI_ONLINE 的时效
    semi_online_vote_threshold: 2      # 连续多少轮 fast 投 SEMI_ONLINE 后允许带并发新消息强制降级
    # 持久化的 ONLINE 记录超过 6 小时未更新时，在进程启动时自动重置为 SEMI_ONLINE
