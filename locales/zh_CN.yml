  back_option: "[ <-- 返回上一步 ]"
  qdrant_host: "Qdrant 主机地址 (默认为 localhost):"
  qdrant_port: "Qdrant 端口 (默认为 6333):"
  mongo_uri: "MongoDB 连接串 (默认为 docker-compose 设置):"
  embed_provider_prompt: "请选择 Embedding (向量化) 服务商:"
