  model_select_prompt: "请为 '{role}' 角色选择模型:"
  model_select_prompt_with_usage: "请为 '{role}' 角色选择模型（用途：{usage}）:"
  model_role_usage_hint: "ℹ️ {role} 将用于：{usage}"
  manual_entry: "--- 手动输入 ---"
  manual_prompt: "请为 '{role}' 手动输入模型名称:"
  summary_title: "\n--- 配置总览 ---"
  save_confirm: "要保存这份配置吗？"
  success_message: "✅ 配置已成功保存至 {file}"
