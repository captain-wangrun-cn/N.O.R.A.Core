    - "Telegram 设置"
    - "LLM 服务商设置"
    - "数据库与记忆设置"
    - "模型选择"
    - "确认保存"

roles:
  smart: "主对话模型 (日常对话 + 复杂推理)"
  fast: "快速响应模型 (忙碌时打断判断/即时回复)"
  coder: "代码模型 (用于代码生成)"
  image: "图片模型 (用于图片输入理解)"
  summary: "总结模型 (用于消息历史压缩)"

roles_usage:
  smart: "默认主对话、复杂推理、工具规划、多轮决策"
  fast: "仅在后端忙碌时用于打断意图判断和快速回复"
  coder: "代码生成、重构、修复与技术实现"
  image: "当消息含图片时用于视觉理解与描述"
  summary: "消息历史压缩、摘要归档、上下文精炼"
