  embed_key_prompt: "Embedding API Key (若留空则复用 LLM Key):"
  embed_model_prompt: "Embedding 模型名称 (推荐 BAAI/bge-m3):"
  embed_dimensions_prompt: "Embedding 向量维度 (必须与模型实际输出一致):"
