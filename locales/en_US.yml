# locales/en_US.yml
wizard:
  welcome: "Welcome to the N.O.R.A. Core YAML Configuration Wizard!"
  token_prompt: "Please enter your Telegram Bot Token:"
  workspace_prompt: "Workspace path (for skills, downloads, etc. Default: ~/.nora/workspace):"
  provider_prompt: "Which primary LLM provider will you use?"
  gemini_key_prompt: "Please enter your Google Gemini API Key:"
  openai_key_prompt: "Please enter your OpenAI API Key:"
  openai_base_url_prompt: "OpenAI API Base URL (default https://api.openai.com/v1; support self-hosted compatible endpoints):"
  openai_base_url_confirm: "Do you want to use a custom OpenAI-compatible Base URL? (Otherwise defaults to https://api.openai.com/v1)"
  model_fetch_error: "Could not fetch models: {error}"
  model_select_prompt: "Select the model for the '{role}' role:"
  model_select_prompt_with_usage: "Select the model for '{role}' (usage: {usage}):"
  model_role_usage_hint: "ℹ️ {role} will be used for: {usage}"
  manual_entry: "--- Manually Enter ---"
  manual_prompt: "Manually enter model name for '{role}':"
  summary_title: "\n--- Configuration Summary ---"
  save_confirm: "Save this configuration?"
  success_message: "✅ Configuration saved to {file}"
  aborted_message: "Configuration aborted."
  back_option: "[ <-- Go Back ]"
  steps:
    - "Telegram Setup"
    - "LLM Provider Setup"
    - "Model Selection"
    - "Confirmation"

roles:
  smart: "primary chat model (daily conversation + complex reasoning)"
  fast: "quick-response model (busy-time interrupt intent + instant replies)"
  coder: "coder (for code generation)"
  summary: "summary (for message history compression)"

roles_usage:
  smart: "default main conversation, complex reasoning, tool planning, and multi-step decisions"
  fast: "used only when backend is busy for interrupt intent detection and quick replies"
  coder: "code generation, refactoring, fixes, and implementation"
  summary: "message history compression, archival summaries, and context condensation"
