# Trigger 子系统配置示例
# 使用方式：复制本文件为 triggers/config.yml 并填写真实参数

enabled: false

# 默认通知聊天目标（可选）
# 为空时，系统会在首次用户消息后自动继承当前会话 chat_id
default_chat_id: ""

email:
  enabled: false
  host: "imap.gmail.com"
  port: 993
  username: "your_email@example.com"
  password: "YOUR_EMAIL_APP_PASSWORD"
  mailbox: "INBOX"
  unseen_only: true
  poll_interval_sec: 60
  max_fetch_per_poll: 20
  max_body_chars: 1200
  # 已审查名单持久化文件（可选）
  # 默认：workspace/cache/email_trigger_reviewed.json
  # reviewed_store_path: "./triggers/email_reviewed.json"
  # 已审查名单最大条数（超出后按最旧淘汰）
  reviewed_store_max: 5000
  # 可选：覆盖默认通知目标 chat_id
  # chat_id: "123456789"
